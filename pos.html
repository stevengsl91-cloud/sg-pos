              return (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                  <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-4 border my-auto max-h-[90vh] overflow-y-auto">
                    <h3 className="font-bold text-lg text-slate-800 border-b pb-2">{t.editSalesTitle}</h3>
                    <form onSubmit={triggerSaveEditSales} className="space-y-3">
                      <div>
                        <label className="text-xs font-bold text-slate-500">{t.custName}</label>
                        <input type="text" required className="w-full mt-1 p-2 border rounded-lg text-xs" value={editingSales.name} onChange={e=>setEditingSales({...editingSales, name: e.target.value})} />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-500">{t.custPhone}</label>
                        <input type="text" required className="w-full mt-1 p-2 border rounded-lg text-xs" value={editingSales.phone} onChange={e=>setEditingSales({...editingSales, phone: e.target.value})} />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-500">{t.startTime}</label>
                        <input type="datetime-local" required className="w-full mt-1 p-2 border rounded-lg text-xs" value={editingSales.startTime} onChange={e=>setEditingSales({...editingSales, startTime: e.target.value})} />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-500">{t.fishingFee}</label>
                        <input type="number" required className="w-full mt-1 p-2 border rounded-lg text-xs" value={editingSales.fishingFee} onChange={e=>setEditingSales({...editingSales, fishingFee: e.target.value})} />
                      </div>

                      <div>
                        <div className="flex justify-between items-center">
                          <label className="text-xs font-bold text-slate-500">{t.prawnWeightCatch}</label>
                          <span className="text-[10px] text-slate-400">Quota: {formatWeight(calc.allowedWeightGrams)}g</span>
                        </div>
                        <input type="number" placeholder="0" className="w-full mt-1 p-2 border rounded-lg text-xs font-bold text-amber-600" value={editingSales.prawnWeight || ''} onChange={e => setEditingSales({ ...editingSales, prawnWeight: e.target.value })} />
                        {calc.excessGrams > 0 && (
                          <div className="mt-1 text-xs text-red-600 font-bold bg-red-50 p-2 rounded-lg border border-red-100 flex justify-between">
                            <span>{t.overweightLabel}: {formatWeight(calc.excessGrams)} g</span>
                            <span>+RM {calc.overweightFee.toFixed(2)}</span>
                          </div>
                        )}
                      </div>

                      <div>
                        <label className="text-xs font-bold text-slate-500">{t.deductPool}</label>
                        <select className="w-full mt-1 p-2 border rounded-lg text-xs bg-slate-50" value={editingSales.deductPool || 'Kolam Besar'} onChange={e=>setEditingSales({...editingSales, deductPool: e.target.value})}>
                          <option value="Kolam Besar">Kolam Besar</option>
                          <option value="Kolam 1">Kolam 1</option>
                          <option value="Kolam 2">Kolam 2</option>
                        </select>
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-xs font-bold text-slate-500">{t.fbCost}</label>
                          <input type="number" className="w-full mt-1 p-2 border rounded-lg text-xs" value={editingSales.fbAmount} onChange={e=>setEditingSales({...editingSales, fbAmount: e.target.value})} />
                        </div>
                        <div>
                          <label className="text-xs font-bold text-slate-500">{t.baitCost}</label>
                          <input type="number" className="w-full mt-1 p-2 border rounded-lg text-xs" value={editingSales.baitCost} onChange={e=>setEditingSales({...editingSales, baitCost: e.target.value})} />
                        </div>
                      </div>

                      <div>
                        <label className="text-xs font-bold text-slate-500">{t.discountLabel}</label>
                        <input type="text" placeholder="e.g. 10 or 10%" className="w-full mt-1 p-2 border rounded-lg text-xs font-bold text-rose-600 bg-rose-50/50" value={editingSales.discountVal || ''} onChange={e=>setEditingSales({...editingSales, discountVal: e.target.value})} />
                      </div>

                      <div className="bg-slate-100 p-2.5 rounded-xl border flex justify-between items-center text-xs">
                        <span className="font-bold text-slate-600">{t.calcTotalPaid}:</span>
                        <span className="font-black text-emerald-600 text-sm">RM {previewTotal.toFixed(2)}</span>
                      </div>

                      <div className="flex gap-2 pt-2">
                        <button type="button" onClick={() => setEditingSales(null)} className="w-1/2 py-2.5 bg-slate-100 font-bold rounded-xl text-xs">{t.btnCancel}</button>
                        <button type="submit" className="w-1/2 py-2.5 bg-emerald-500 text-slate-900 font-bold rounded-xl text-xs">{t.btnEdit}</button>
                      </div>
                    </form>
                  </div>
                </div>
              );
            })()}

            {/* Edit Log Modal */}
            {editingLog && isOwner && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-4 border my-auto max-h-[90vh] overflow-y-auto">
                  <h3 className="font-bold text-lg text-slate-800 border-b pb-2">{t.editLogTitle}</h3>
                  <form onSubmit={triggerSaveEditLog} className="space-y-3">
                    <div>
                      <label className="text-xs font-bold text-slate-500">Masa (Time)</label>
                      <input type="datetime-local" required className="w-full mt-1 p-2 border rounded-lg text-xs" value={editingLog.time} onChange={e=>setEditingLog({...editingLog, time: e.target.value})} />
                    </div>

                    {editingLog.type === 'catch' && (
                      <div>
                        <label className="text-xs font-bold text-slate-500">{t.sourcePool}</label>
                        <select className="w-full mt-1 p-2 border rounded-lg text-xs bg-slate-50" value={editingLog.sourcePool || 'Kolam Besar'} onChange={e=>setEditingLog({...editingLog, sourcePool: e.target.value})}>
                          <option value="Kolam Besar">Kolam Besar</option>
                          <option value="Kolam 1">Kolam 1</option>
                          <option value="Kolam 2">Kolam 2</option>
                        </select>
                      </div>
                    )}

                    <div>
                      <label className="text-xs font-bold text-slate-500">Berat Weight (Gram)</label>
                      <input type="number" required className="w-full mt-1 p-2 border rounded-lg text-xs font-bold" value={editingLog.weight} onChange={e=>setEditingLog({...editingLog, weight: e.target.value})} />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-500">Catatan (Remark)</label>
                      <input type="text" className="w-full mt-1 p-2 border rounded-lg text-xs" value={editingLog.remark} onChange={e=>setEditingLog({...editingLog, remark: e.target.value})} />
                    </div>
                    <div className="flex gap-2 pt-2">
                      <button type="button" onClick={() => setEditingLog(null)} className="w-1/2 py-2.5 bg-slate-100 font-bold rounded-xl text-xs">{t.btnCancel}</button>
                      <button type="submit" className="w-1/2 py-2.5 bg-emerald-500 text-slate-900 font-bold rounded-xl text-xs">{t.btnEdit}</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Confirm Action Modal */}
            {editConfirmModal.open && (
              <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 z-[60] overflow-y-auto">
                <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl space-y-4 border text-center my-auto">
                  <div className="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
                    <i className="fa-solid fa-triangle-exclamation"></i>
                  </div>
                  <div>
                    <h3 className="font-bold text-base text-slate-800">{t.confirmModalTitle}</h3>
                    <p className="text-xs text-slate-500 mt-1.5">{t.confirmModalDesc}</p>
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button 
                      type="button" 
                      onClick={() => setEditConfirmModal({ open: false, onConfirm: null })} 
                      className="w-1/2 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition"
                    >
                      {t.btnNoCancel}
                    </button>
                    <button 
                      type="button" 
                      onClick={() => { if (editConfirmModal.onConfirm) editConfirmModal.onConfirm(); }} 
                      className="w-1/2 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded-xl text-xs transition shadow-md"
                    >
                      {t.btnYesConfirm}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Checkout Modal */}
            {checkoutItem && (() => {
              const fish = checkoutItem.fishingFee || 0;
              const fb = parseFloat(checkoutForm.fbAmount) || 0;
              const bait = parseFloat(checkoutForm.baitCost) || 0;
              const calc = calculatePrawnOverweight(fish, checkoutForm.prawnWeight);
              const subtotal = fish + fb + bait + calc.overweightFee;
              const discAmount = parseDiscountValue(checkoutForm.discountVal, subtotal);
              const calculatedTotal = Math.max(0, subtotal - discAmount);

              return (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                  <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-4 border my-auto max-h-[90vh] overflow-y-auto">
                    <h3 className="font-bold text-lg text-slate-800 border-b pb-2">{t.checkoutTitle}</h3>
                    <form onSubmit={handleCompleteCheckout} className="space-y-3">
                      <div>
                        <label className="text-xs font-bold text-slate-500">{t.endTime}</label>
                        <input type="datetime-local" className="w-full mt-1 p-2 border rounded-lg text-xs" value={checkoutForm.endTime} onChange={e=>setCheckoutForm({...checkoutForm, endTime: e.target.value})} />
                      </div>
                      <div>
                        <div className="flex justify-between items-center">
                          <label className="text-xs font-bold text-slate-500">{t.prawnWeightCatch}</label>
                          <span className="text-[10px] text-slate-400 font-bold">Quota: {formatWeight(calc.allowedWeightGrams)}g</span>
                        </div>
                        <input type="number" min="0" placeholder="0" className="w-full mt-1 p-2 border rounded-lg font-bold text-amber-600 text-base" value={checkoutForm.prawnWeight} onChange={e=>setCheckoutForm({...checkoutForm, prawnWeight: e.target.value})} />
                        
                        {calc.excessGrams > 0 ? (
                          <div className="mt-2 text-xs text-red-600 font-bold bg-red-50 p-2.5 rounded-xl border border-red-100 flex justify-between items-center">
                            <div>
                              <span className="block text-[10px] text-red-400">Overweight (+RM0.07/g)</span>
                              <span>{t.overweightLabel}: {formatWeight(calc.excessGrams)} g</span>
                            </div>
                            <span className="text-sm">+RM {calc.overweightFee.toFixed(2)}</span>
                          </div>
                        ) : (
                          <div className="mt-1 text-[10px] text-emerald-600 font-bold">{t.withinQuotaLabel} (Quota: {formatWeight(calc.allowedWeightGrams)}g)</div>
                        )}
                      </div>

                      <div>
                        <label className="text-xs font-bold text-slate-500">{t.deductPool}</label>
                        <select className="w-full mt-1 p-2 border rounded-lg text-xs bg-slate-50" value={checkoutForm.deductPool} onChange={e=>setCheckoutForm({...checkoutForm, deductPool: e.target.value})}>
                          <option value="Kolam Besar">Kolam Besar</option>
                          <option value="Kolam 1">Kolam 1</option>
                          <option value="Kolam 2">Kolam 2</option>
                        </select>
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-xs font-bold text-slate-500">{t.fbCost}</label>
                          <input type="number" placeholder="RM 0" className="w-full mt-1 p-2 border rounded-lg text-xs" value={checkoutForm.fbAmount} onChange={e=>setCheckoutForm({...checkoutForm, fbAmount: e.target.value})} />
                        </div>
                        <div>
                          <label className="text-xs font-bold text-slate-500">{t.baitCost}</label>
                          <input type="number" placeholder="RM 0" className="w-full mt-1 p-2 border rounded-lg text-xs" value={checkoutForm.baitCost} onChange={e=>setCheckoutForm({...checkoutForm, baitCost: e.target.value})} />
                        </div>
                      </div>

                      <div>
                        <label className="text-xs font-bold text-slate-500">{t.discountLabel}</label>
                        <input type="text" placeholder="e.g. 10 or 10%" className="w-full mt-1 p-2 border rounded-lg text-xs font-bold text-rose-600 bg-rose-50/50 border-rose-200" value={checkoutForm.discountVal} onChange={e=>setCheckoutForm({...checkoutForm, discountVal: e.target.value})} />
                      </div>

                      <div className="bg-slate-100 p-3 rounded-xl border flex justify-between items-center mt-2">
                        <div>
                          <span className="text-xs font-bold text-slate-600 block">Total Paid:</span>
                          {discAmount > 0 && <span className="text-[10px] text-rose-500 font-bold">Discount: -RM {discAmount.toFixed(2)}</span>}
                        </div>
                        <span className="text-xl font-black text-emerald-600">RM {calculatedTotal.toFixed(2)}</span>
                      </div>

                      <div className="flex gap-2 pt-2">
                        <button type="button" onClick={() => setCheckoutItem(null)} className="w-1/2 py-2.5 bg-slate-100 font-bold rounded-xl text-xs">{t.btnCancel}</button>
                        <button type="submit" className="w-1/2 py-2.5 bg-emerald-500 text-slate-900 font-bold rounded-xl text-xs">{t.btnSaveCheckout}</button>
                      </div>
                    </form>
                  </div>
                </div>
              );
            })()}

            {/* Screenshot Modal */}
            {showReportModal && isOwner && (
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                <div className="bg-white rounded-3xl p-6 w-full max-w-lg shadow-2xl space-y-4 border my-8">
                  
                  <div ref={reportRef} className="bg-white p-6 rounded-2xl border border-slate-200 text-slate-800 space-y-5">
                    <div className="border-b border-slate-200 pb-3 flex justify-between items-end">
                      <div>
                        <h1 className="font-black text-xl text-emerald-600">{COMPANY_INFO.name}</h1>
                        <p className="text-[11px] text-slate-400 mt-0.5">{COMPANY_INFO.address}</p>
                      </div>
                      <div className="text-right">
                        <span className="bg-slate-900 text-white text-[10px] font-bold px-2.5 py-1 rounded-full">{currentSummary.title}</span>
                        <p className="text-xs font-mono font-bold text-slate-600 mt-1">{currentSummary.dateTag}</p>
                      </div>
                    </div>

                    <div>
                      <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">{t.currentPoolStockSection}</h2>
                      <div className="grid grid-cols-3 gap-2 text-center">
                        <div className="bg-slate-800 text-white p-2.5 rounded-xl border">
                          <span className="text-[10px] text-slate-300 block font-semibold">Kolam Besar</span>
                          <strong className="text-base font-black text-emerald-400">{formatWeight(poolBalances['Kolam Besar'])} <span className="text-[10px] font-normal">g</span></strong>
                        </div>
                        <div className="bg-slate-800 text-white p-2.5 rounded-xl border">
                          <span className="text-[10px] text-slate-300 block font-semibold">Kolam 1</span>
                          <strong className="text-base font-black text-emerald-400">{formatWeight(poolBalances['Kolam 1'])} <span className="text-[10px] font-normal">g</span></strong>
                        </div>
                        <div className="bg-slate-800 text-white p-2.5 rounded-xl border">
                          <span className="text-[10px] text-slate-300 block font-semibold">Kolam 2</span>
                          <strong className="text-base font-black text-emerald-400">{formatWeight(poolBalances['Kolam 2'])} <span className="text-[10px] font-normal">g</span></strong>
                        </div>
                      </div>
                    </div>

                    <div>
                      <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">{t.salesSummarySection}</h2>
                      <div className="grid grid-cols-2 gap-3">
                        <div className="bg-emerald-50 p-3 rounded-xl border border-emerald-100 col-span-2 flex justify-between items-center">
                          <span className="font-bold text-emerald-800 text-sm">{t.totalRevenue}</span>
                          <span className="text-2xl font-black text-emerald-600">RM {currentSummary.revenue.toFixed(2)}</span>
                        </div>
                        <div className="bg-slate-50 p-2.5 rounded-xl border text-xs">
                          <span className="text-slate-500 block">🎣 {t.fishingFee}:</span>
                          <strong className="text-slate-800 text-sm">RM {currentSummary.fishing.toFixed(2)}</strong>
                        </div>
                        <div className="bg-slate-50 p-2.5 rounded-xl border text-xs">
                          <span className="text-slate-500 block">{t.fbCost}:</span>
                          <strong className="text-slate-800 text-sm">RM {currentSummary.fb.toFixed(2)}</strong>
                        </div>
                        <div className="bg-slate-50 p-2.5 rounded-xl border text-xs">
                          <span className="text-slate-500 block">{t.baitCost}:</span>
                          <strong className="text-slate-800 text-sm">RM {currentSummary.bait.toFixed(2)}</strong>
                        </div>
                        <div className="bg-slate-50 p-2.5 rounded-xl border text-xs">
                          <span className="text-slate-500 block">{t.discountLabel}:</span>
                          <strong className="text-rose-600 text-sm">-RM {currentSummary.totalDiscount.toFixed(2)}</strong>
                        </div>
                      </div>
                    </div>

                    <div>
                      <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">{t.prawnSummarySection} ({currentSummary.dateTag})</h2>
                      <div className="grid grid-cols-2 gap-3 text-xs">
                        <div className="bg-blue-50 p-3 rounded-xl border border-blue-100">
                          <span className="text-blue-600 font-bold block">🚚 {t.totalSupplierIn}</span>
                          <span className="text-xl font-black text-blue-700 mt-0.5 block">+{formatWeight(currentSummary.supplierIn)} <span className="text-xs font-normal">g</span></span>
                        </div>
                        <div className="bg-amber-50 p-3 rounded-xl border border-amber-100">
                          <span className="text-amber-700 font-bold block">🎣 {t.totalCatch}</span>
                          <span className="text-xl font-black text-amber-600 mt-0.5 block">-{formatWeight(currentSummary.catchWeight)} <span className="text-xs font-normal">g</span></span>
                        </div>
                        <div className="bg-red-50 p-3 rounded-xl border border-red-100">
                          <span className="text-red-600 font-bold block">{t.deadPrawn}</span>
                          <span className="text-xl font-black text-red-600 mt-0.5 block">-{formatWeight(currentSummary.deadLoss)} <span className="text-xs font-normal">g</span></span>
                        </div>
                        <div className="bg-purple-50 p-3 rounded-xl border border-purple-100">
                          <span className="text-purple-600 font-bold block">{t.lostRecord}</span>
                          <span className="text-xl font-black text-purple-600 mt-0.5 block">-{formatWeight(currentSummary.lostCount)} <span className="text-xs font-normal">g</span></span>
                        </div>
                      </div>
                    </div>

                    <div className="border-t pt-2 text-[10px] text-slate-400 text-center">
                      {t.generatedTag}
                    </div>
                  </div>

                  <div className="flex gap-3 pt-2">
                    <button onClick={() => setShowReportModal(false)} className="w-1/3 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition text-xs" disabled={isCapturing}>
                      {t.btnCancel}
                    </button>
                    <button onClick={handleSaveAndExit} className="w-2/3 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition text-xs flex items-center justify-center gap-2 shadow-lg" disabled={isCapturing}>
                      <i className="fa-solid fa-floppy-disk"></i> {isCapturing ? t.saving : t.btnSaveExit}
                    </button>
                  </div>

                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
